name: Terraform — AuthFlow Shared Infrastructure
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
 
permissions:
  id-token: write   # required for OIDC federation
  contents: read    # required to checkout the repo
  pull-requests: write # required to post plan output as PR comment

env:
  TF_VERSION: "1.15.2"
  TFLINT_VERSION: "v0.50.3"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  #  GLOBAL LAYER 
  global:
    name: "Global — Front Door, ACR, DNS"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global/
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
 
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}
 
      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true
 
      - name: Terraform Init
        id: init
        run: |
         terraform init \
          -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
          -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
          -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
          -backend-config="key=authflow/global/global.tfstate" \
          -backend-config="use_oidc=true"

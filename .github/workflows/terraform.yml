name: Terraform — AuthFlow Shared Infrastructure

on:
  push:
    branches:
      - main
    paths:
    - 'global/**'
    - 'shared/**'
  pull_request:
    branches:
      - main
    paths:
    - 'global/**'
    - 'shared/**'

permissions:
  id-token: write      # required for OIDC federation
  contents: read       # required to checkout the repo
  pull-requests: write # required to post plan output as PR comment
  security-events: write # required for SARIF upload

env:
  TF_VERSION: "1.15.2"
  TFLINT_VERSION: "v0.50.3"

jobs:
  # SECURITY SCANNING
  security:
    name: "Security Scanning — Checkov"
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Checkov - Global
        uses: bridgecrewio/checkov-action@v12
        with:
            directory: global/
            framework: terraform
            output_format: sarif
            output_file_path: checkov- global-results.sarif
            soft_fail: false # fail the action if any issues are found
            
      - name: Upload Checkov Global SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v2
        if: always() # ensure this runs even if Checkov finds issues
        with:
          sarif_file: checkov-global-results.sarif
          category: "Terraform Security Scan - Global Layer"

      - name: Run Checkov - Shared
        uses: bridgecrewio/checkov-action@v12
        with:
            directory: shared/
            framework: terraform
            output_format: sarif
            output_file_path: checkov-shared-results.sarif
            soft_fail: false # fail the action if any issues are found

      - name: Upload Checkov Shared SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v2
        if: always() # ensure this runs even if Checkov finds issues
        with:
          sarif_file: checkov-shared-results.sarif
          category: "Terraform Security Scan - Shared Layer"

  # GLOBAL LAYER
  global:
    name: "Global — Front Door, ACR, DNS"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: global/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      
      - name: Configure Git for Terraform modules
        env:
          TOKEN: ${{ secrets.MODULES_GITHUB_TOKEN }}
        run: |
          git config --global url."https://${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=authflow/global/global.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: TFLint
        id: tflint
        run: |
         tflint --init
         tflint --no-color --minimum-failure-severity=error

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Store Plan Output
        id: plan-output
        run: |
          PLAN=$(cat plan.txt)
          echo "PLAN<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### 🌍 Global Layer — Terraform Plan

            | Step | Result |
            |------|--------|
            | Format | \`${{ steps.fmt.outcome }}\` |
            | Init | \`${{ steps.init.outcome }}\` |
            | Validate | \`${{ steps.validate.outcome }}\` |
            | TFLint | \`${{ steps.tflint.outcome }}\` |
            | Plan | \`${{ steps.plan.outcome }}\` |

            <details><summary>📋 Show Plan Output</summary>

            \`\`\`terraform
            ${{ steps.plan-output.outputs.PLAN }}
            \`\`\`

            </details>

            > Triggered by @${{ github.actor }} via \`${{ github.event_name }}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

  # ── SHARED LAYER ────────────────────────────────────────────────────────────
  shared:
    name: "Shared — VNet, Subnets, Log Analytics"
    runs-on: ubuntu-latest
    needs: [global]
    defaults:
      run:
        working-directory: shared/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Git for Terraform modules
        env:
          TOKEN: ${{ secrets.MODULES_GITHUB_TOKEN }}
        run: |
          git config --global url."https://${TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Terraform Init
        id: init
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ secrets.TF_STATE_RESOURCE_GROUP }}" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ secrets.TF_STATE_CONTAINER }}" \
            -backend-config="key=authflow/shared/shared.tfstate" \
            -backend-config="use_azuread_auth=true"

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: TFLint
        id: tflint
        run: |
         tflint --init
         tflint --no-color --minimum-failure-severity=error

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Store Plan Output
        id: plan-output
        run: |
          PLAN=$(cat plan.txt)
          echo "PLAN<<EOF" >> $GITHUB_OUTPUT
          echo "$PLAN" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post Plan to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `### 🔗 Shared Layer — Terraform Plan

            | Step | Result |
            |------|--------|
            | Format | \`${{ steps.fmt.outcome }}\` |
            | Init | \`${{ steps.init.outcome }}\` |
            | Validate | \`${{ steps.validate.outcome }}\` |
            | TFLint | \`${{ steps.tflint.outcome }}\` |
            | Plan | \`${{ steps.plan.outcome }}\` |

            <details><summary>📋 Show Plan Output</summary>

            \`\`\`terraform
            ${{ steps.plan-output.outputs.PLAN }}
            \`\`\`

            </details>

            > Triggered by @${{ github.actor }} via \`${{ github.event_name }}\``;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan